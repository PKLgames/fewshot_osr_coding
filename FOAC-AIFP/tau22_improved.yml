train:
  # ========== Audio feature extractor (unchanged) ==========
  extractor:
    window_size: 1024
    hop_size: 256
    sample_rate: 16000
    mel_bins: 128
    fmin: 0
    fmax: 8000
    window: 'hann'

  # ========== Episode structure ==========
  # TAU-22: 6 base classes, 4 novel classes
  # Now supports n_ways=6, n_open_ways=4 (model constraint fixed)
  n_ways: 6                # Use all 6 base classes (was 2)
  n_open_ways: 4           # Use all 4 novel classes (was 2)
  n_shots: 5
  n_queries: 15            # Keep original for stability
  train_classes: 6          # base classes

  # ---- 改进: 更多 episode 提升泛化 ----
  n_train_runs: 400
  n_test_runs: 200
  test_times: 200

  # ========== Training hyper-parameters ==========
  epoch: 80
  epochs_pre: 80
  batch_size: 256          # Increased for better GPU utilization
  learning_rate: 0.05
  lr: 0.001
  gamma: 0.1
  weight_decay: 5.0e-4
  lr_decay_epochs: '40,70'
  lr_decay_rate: 0.1
  nesterov: true
  seed: 42
  val_epoch: 1

  # ========== Model ==========
  test_way: 6              # Match n_ways
  train_way: 6             # Match n_ways
  train_shot: 5
  test_shot:
    - 5
  train_query_shot: 15     # Match n_queries
  test_query_shot: 15      # Match n_queries
  resnet: true

  # ---- 核心改进: 增大温度 + 调整损失权重 ----
  temp: 10.0               # was 1.0
  weight_pl: 0.2           # was 0.1
  beta: 0.05               # was 0.1
  open_weight_sum_cali: 0.3  # was 0.5

  # ========== Paths ==========
  save_folder: './tau22_v2'
  dataroot: '/coding/TAU-urban-acoustic-scenes-2022-mobile-development'
  pretrained_model_path1: ''
  pretrained_model_path: './tau22_v2/pretrain_model_tau22.pth'

  # ========== Loss ==========
  num-centers: 1

  # ========== Misc ==========
  dataset: 'TAU22'
  pretrain: false
  test: false              # Set to true for evaluation only
  finetune: false
  no_val: false
