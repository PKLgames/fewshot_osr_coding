train:
  # ========== Audio feature extractor (unchanged) ==========
  extractor:
    window_size: 1024
    hop_size: 256
    sample_rate: 16000
    mel_bins: 128
    fmin: 0
    fmax: 8000
    window: 'hann'

  # ========== Episode structure (aligned with episodic_trainer.py) ==========
  # TAU-19: 6 base classes, 4 novel classes
  # Note: TAU-19 has only ~50 test samples/class, so Q_query=100 is impossible
  # (max ~45 after 5-shot support). Keep n_queries=15 as ceiling.
  n_ways: 6
  n_open_ways: 4
  test_n_ways: 6            # Aligned: consistent 6-way eval (was 2)
  test_n_open_ways: 4       # Aligned: use all 4 unknown classes at test (was 2)
  n_shots: 5
  n_queries: 15             # Data limit: TAU-19 only has ~50 samples/class
  train_classes: 6

  # Meta-train / meta-test episode counts
  n_train_runs: 400
  n_test_runs: 200
  test_times: 200

  # ========== Training hyper-parameters ==========
  epoch: 20
  epochs_pre: 20
  batch_size: 512
  learning_rate: 0.05
  lr: 0.001
  gamma: 0.1
  weight_decay: 5.0e-4
  lr_decay_epochs: '10,18'
  lr_decay_rate: 0.1
  nesterov: true
  seed: 42
  val_epoch: 1

  # ========== Model ==========
  test_way: 6
  train_way: 6
  train_shot: 5
  test_shot:
    - 5
  train_query_shot: 15
  test_query_shot: 15
  resnet: true

  temp: 10.0
  weight_pl: 0.2
  beta: 0.05
  open_weight_sum_cali: 0.3

  # ========== Paths ==========
  save_folder: './tau19_aligned'
  dataroot: '/coding/TAU-urban-acoustic-scenes-2019-development'
  pretrained_model_path1: ''
  pretrained_model_path: './tau19_aligned/pretrain_model_tau19.pth'

  # ========== Loss ==========
  num-centers: 1

  # ========== OSR evaluation protocol (matching episodic_trainer.py) ==========
  osr_num_rounds: 10
  osr_k_shot: 50

  # ========== Misc ==========
  dataset: 'TAU19'
  pretrain: false
  test: true
  finetune: false
  no_val: false
