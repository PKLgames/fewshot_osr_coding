train:
  # ========== Audio feature extractor (unchanged) ==========
  extractor:
    window_size: 1024
    hop_size: 256
    sample_rate: 16000
    mel_bins: 128
    fmin: 0
    fmax: 8000
    window: 'hann'

  # ========== Episode structure ==========
  # TAU-19 has 6 base classes → n_ways + n_open_ways <= 6
  n_ways: 2
  n_open_ways: 2
  n_shots: 5
  n_queries: 15
  train_classes: 6          # base classes: airport,shopping_mall,metro_station,street_pedestrian,public_square,street_traffic

  # Meta-train / meta-test episode counts (same as improved.yml)
  n_train_runs: 400
  n_test_runs: 200
  test_times: 200

  # ========== Training hyper-parameters ==========
  epoch: 80
  epochs_pre: 80
  batch_size: 64
  learning_rate: 0.05
  lr: 0.001
  gamma: 0.1
  weight_decay: 5.0e-4
  lr_decay_epochs: '40,70'
  lr_decay_rate: 0.1
  nesterov: true
  seed: 42
  val_epoch: 1

  # ========== Model ==========
  test_way: 2
  train_way: 2
  train_shot: 5
  test_shot:
    - 5
  train_query_shot: 15
  test_query_shot: 15
  resnet: true

  temp: 10.0
  weight_pl: 0.2
  beta: 0.05
  open_weight_sum_cali: 0.3

  # ========== Paths ==========
  save_folder: './tau19'
  dataroot: '/coding/TAU-urban-acoustic-scenes-2019-development'
  pretrained_model_path1: ''
  pretrained_model_path: './tau19/pretrain_model_tau19.pth'

  # ========== Loss ==========
  num-centers: 1

  # ========== Misc ==========
  dataset: 'TAU19'
  pretrain: false
  test: false
  finetune: false
  no_val: false
