train:
  # ========== Audio feature extractor (unchanged) ==========
  extractor:
    window_size: 1024
    hop_size: 256
    sample_rate: 16000
    mel_bins: 128
    fmin: 0
    fmax: 8000
    window: 'hann'

  # ========== Episode structure ==========
  n_ways: 2
  n_open_ways: 2
  n_shots: 5
  n_queries: 15
  train_classes: 6

  # ---- 改进: 更多 episode 提升泛化 ----
  n_train_runs: 400        # was 200, 6基类仅90种组合, 增加采样多样性
  n_test_runs: 200         # was 100, 更稳定的评估
  test_times: 200

  # ========== Training hyper-parameters ==========
  # ---- 改进: 更长训练 + 后移 LR 衰减 ----
  epoch: 80                # was 60, loss 仍在下降需要更多轮
  epochs_pre: 80           # was 60
  batch_size: 64
  learning_rate: 0.05
  lr: 0.001
  gamma: 0.1
  weight_decay: 5.0e-4
  lr_decay_epochs: '40,70' # was '15,35', 配合 80 epoch 后移衰减点
  lr_decay_rate: 0.1
  nesterov: true
  seed: 42
  val_epoch: 1

  # ========== Model ==========
  test_way: 2
  train_way: 2
  train_shot: 5
  test_shot:
    - 5
  train_query_shot: 15
  test_query_shot: 15
  resnet: true

  # ---- 核心改进: 增大温度 + 调整损失权重 ----
  # 原因: temp=1.0 时余弦相似度直接进 softmax, 概率近乎均匀 (AUROC≈50%)
  #        Metric_Cosine 原始默认值即为 10.0, 之前被 config 覆盖为 1.0
  temp: 10.0               # was 1.0 → 放大余弦差异, 使预测更锐利

  # prototype loss: 增强, 促使同类样本向中心聚集
  weight_pl: 0.2           # was 0.1

  # 熵正则: 减弱, 模型已欠拟合不需要鼓励均匀预测
  beta: 0.05               # was 0.1

  # 开放集权重校准: 降低初始偏置, 让模型自由学习开放集边界
  open_weight_sum_cali: 0.3  # was 0.5

  # ========== Paths ==========
  save_folder: './save_tau22'
  dataroot: '/coding/TAU-urban-acoustic-scenes-2022-mobile-development'
  pretrained_model_path1: ''
  pretrained_model_path: './save_tau22/pretrain_model_tau22.pth'

  # ========== Loss ==========
  num-centers: 1

  # ========== Misc ==========
  dataset: 'TAU22'
  pretrain: false
  test: false
  finetune: false
  no_val: false
