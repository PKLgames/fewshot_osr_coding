train:
  # ========== Audio feature extractor ==========
  extractor:
    window_size: 1024
    hop_size: 256
    sample_rate: 16000
    mel_bins: 128
    fmin: 0
    fmax: 8000
    window: 'hann'

  # ========== Episode structure ==========
  n_ways: 2
  n_open_ways: 2
  n_shots: 5
  n_queries: 15
  train_classes: 6

  # Reduced for debug trial
  n_train_runs: 5
  n_test_runs: 5
  test_times: 5

  # ========== Training hyper-parameters (minimal for debug) ==========
  epoch: 2
  epochs_pre: 2
  batch_size: 64
  learning_rate: 0.05
  lr: 0.001
  gamma: 0.1
  weight_decay: 5.0e-4
  lr_decay_epochs: '2'
  lr_decay_rate: 0.1
  nesterov: true
  seed: 42
  val_epoch: 1

  # ========== Model ==========
  test_way: 2
  train_way: 2
  train_shot: 5
  test_shot:
    - 5
  train_query_shot: 15
  test_query_shot: 15
  resnet: true
  open_weight_sum_cali: 0.5

  # ========== Paths ==========
  save_folder: './save_tau22'
  dataroot: '/coding/TAU-urban-acoustic-scenes-2022-mobile-development'
  pretrained_model_path1: ''
  pretrained_model_path: './save_tau22/pretrain_model_tau22.pth'

  # ========== Loss ==========
  weight_pl: 0.1
  beta: 0.1
  temp: 1.0
  num-centers: 1

  # ========== Misc ==========
  dataset: 'TAU22'
  pretrain: false
  test: false
  finetune: false
  no_val: false
